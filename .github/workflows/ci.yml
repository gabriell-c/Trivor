name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ------------------------------------------------------------------
  # Lint
  # ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Ruff (Python)
        run: ruff check backend/ tests/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npx eslint .

  # ------------------------------------------------------------------
  # Backend unit + integration tests
  # ------------------------------------------------------------------
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      # Opt-in dos testes de browser (tests/test_apply_browser.py — engines
      # headless). "0" por padrão: os browsers não são instalados e o guarda
      # do próprio arquivo skipa a suíte. Para ligar: definir "1" aqui — o
      # step condicional instala patchright/camoufox antes do pytest.
      TRIVOR_BROWSER_TESTS: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Install apply browser engines (opt-in TRIVOR_BROWSER_TESTS=1)
        if: env.TRIVOR_BROWSER_TESTS == '1'
        run: |
          patchright install chromium
          camoufox fetch

      - name: Start backend + run pytest
        # O servidor e o pytest vivem no MESMO step: um processo com `&` morre
        # ao fim do `run:` em que foi iniciado — em steps separados, o pytest
        # rodaria sem o backend (CI instável). Quem sobe, desce: o PID do
        # uvicorn é encerrado no fim do próprio step.
        # test_apply_browser.py só roda quando TRIVOR_BROWSER_TESTS=1 (env do
        # job acima) — por padrão é skip, sem inflar o CI.
        run: |
          cd backend
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          UVICORN_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/health > /dev/null; then
            cat /tmp/uvicorn.log
            exit 1
          fi
          cd ..
          set +e
          pytest tests/ -v --tb=short --ignore=tests/test_e2e.py
          STATUS=$?
          set -e
          kill "$UVICORN_PID" 2>/dev/null || true
          exit "$STATUS"

  # ------------------------------------------------------------------
  # Frontend build
  # ------------------------------------------------------------------
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

  # ------------------------------------------------------------------
  # Docker build (só build, sem run — pega imagem quebrada cedo)
  # ------------------------------------------------------------------
  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile -t trivor-backend .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t trivor-frontend .

  # ------------------------------------------------------------------
  # E2E tests (Playwright + Next.js dev server)
  # ------------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps
        run: cd frontend && npm ci

      - name: Start servers + run E2E tests
        # Backend e dev server de front vivem neste MESMO step: processo com
        # `&` morre ao fim do `run:` — em steps separados, o pytest rodaria
        # com os dois servidores descritos. Quem sobe, desce: os PIDs são
        # encerrados ao final (e os filhos, por PID específico — nunca
        # global). O `pytest-playwright` e o `playwright` vêm do requirements
        # completo do backend (já instalado acima).
        run: |
          (cd backend && exec python -m uvicorn main:app --host 127.0.0.1 --port 8000) > /tmp/uvicorn.log 2>&1 &
          UVICORN_PID=$!
          (cd frontend && exec npx next dev --port 3000) > /tmp/next-dev.log 2>&1 &
          NEXT_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/health > /dev/null; then
            cat /tmp/uvicorn.log
            exit 1
          fi
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000 > /dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:3000 > /dev/null 2>&1; then
            cat /tmp/next-dev.log
            exit 1
          fi
          set +e
          pytest tests/test_e2e.py -v --tb=short
          STATUS=$?
          set -e
          kill "$UVICORN_PID" "$NEXT_PID" 2>/dev/null || true
          pkill -P "$UVICORN_PID" 2>/dev/null || true
          pkill -P "$NEXT_PID" 2>/dev/null || true
          exit "$STATUS"

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: playwright-report/
