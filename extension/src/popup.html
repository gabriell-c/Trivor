<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivor Exporter</title>
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(99, 102, 241, 0.25);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 360px;
      min-height: 480px;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      flex-col: column;
      gap: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .status-card strong {
      color: var(--text);
    }

    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4338ca);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.8);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .result-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .result-box.active {
      display: flex;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px;
      color: #cbd5e1;
      font-family: monospace;
      font-size: 11px;
      resize: none;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .toast {
      font-size: 11px;
      padding: 8px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .toast.success {
      display: flex;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .toast.error {
      display: flex;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fca5a5;
    }

    .loader {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-footer {
      margin-top: auto;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-icon">T</div>
      <div class="brand-title">Trivor Exporter</div>
    </div>
    <span class="badge">v1.0.0</span>
  </div>

  <div id="statusCard" class="status-card">
    <span id="statusText">Abra seu próprio perfil no LinkedIn para iniciar a exportação.</span>
  </div>

  <button id="btnExtract" class="btn btn-primary">
    <span>⚡ Exportar Meu Perfil</span>
  </button>

  <div id="toast" class="toast"></div>

  <div id="resultBox" class="result-box">
    <textarea id="jsonOutput" readonly placeholder="O JSON do perfil exportado aparecerá aqui..."></textarea>
    <div class="actions-grid">
      <button id="btnCopy" class="btn btn-secondary">
        📋 Copiar JSON
      </button>
      <button id="btnDownloadJson" class="btn btn-secondary">
        💾 Baixar JSON
      </button>
    </div>
    <button id="btnDownloadMd" class="btn btn-secondary" style="width: 100%;">
      📝 Baixar Markdown (.md)
    </button>
  </div>

  <div class="info-footer">
    Trivor — Diagnóstico e Inteligência de Perfil via IA
  </div>

  <script src="popup.js"></script>
</body>
</html>
